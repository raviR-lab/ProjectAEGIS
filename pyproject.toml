[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Project AEGIS - AI-driven release shield (Connected Intelligence Graph)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
